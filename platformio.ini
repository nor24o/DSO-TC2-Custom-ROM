; PlatformIO Project Configuration File
; Project: FNIRSI DSO-TC2 2.4" TFT Display Bring-up & Diagnostics
; Target MCU: WCH CH32F103C6 / STM32F103C6 (Hardware probed: 32KB Flash, 10KB SRAM)
; Framework: Arduino (ST STM32duino)

[env:genericSTM32F103C6]
platform = ststm32
board = genericSTM32F103C6
framework = arduino

; Clock configuration: 72 MHz SYSCLK using 8 MHz External Crystal (HSE)
board_build.f_cpu = 72000000L

build_flags = 
    -D HSE_VALUE=8000000U

; Upload Protocol: SEGGER J-Link (connected via SWD)
upload_protocol = jlink

lib_deps = 
    koendv/RTT Stream @ ^1.4.1

build_type = release
