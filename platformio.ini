; PlatformIO Project Configuration File
; FNIRSI DSO-TC2 Dual-MCU Custom ROM
; - Display MCU: WCH CH32F103 / STM32F103C6 (LQFP48) -> 186 FPS ST7789 TFT
; - Tester MCU:  STM32L083RZT6 (LQFP64)              -> Component Tester & Keypad

[platformio]
default_envs = display_f103, tester_l083

[env:display_f103]
platform = ststm32
board = genericSTM32F103C6
framework = arduino
board_build.f_cpu = 72000000L
build_flags = 
    -D HSE_VALUE=8000000U
    -D TARGET_DISPLAY
build_src_filter = -<*> +<display/*>
lib_deps = 
    koendv/RTT Stream @ ^1.4.1
build_type = release

[env:tester_l083]
platform = ststm32
board = nucleo_l073rz
framework = arduino
build_flags = 
    -D TARGET_TESTER
build_src_filter = -<*> +<tester/*>
lib_deps = 
    koendv/RTT Stream @ ^1.4.1
build_type = release
